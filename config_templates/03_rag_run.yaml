# Step 3: RAG generation — run the LLM over retrieved chunks to produce answers
# Command: python -m financebench_eval run-rag --config config_templates/03_rag_run.yaml

rag_eval:
  # FILL: path to examples.jsonl (questions + gold answers) from step 1
  examples_path: data/processed/financebench/examples.jsonl

  # FILL: path to retrieval_results.jsonl written by the retrieve step (step 2)
  #   e.g. runs/run_001/retrieval_results.jsonl
  retrieval_results_path: runs/<run_id>/retrieval_results.jsonl

  # FILL: run ID of the retrieval run above (for provenance tracking)
  retrieval_run_id: run_001

  # Directory where this RAG run's outputs will be written
  output_dir: runs

  # RAG mode — controls what context the model receives:
  #   rag_dense       → top-k retrieved chunks (standard RAG)
  #   rag_oracle      → gold evidence text (upper-bound experiment)
  #   rag_no_context  → no context (same as closed-book, for ablation)
  mode: rag_dense

  # How many retrieved chunks to include in the prompt
  top_k: 5

  # Maximum characters of context passed to the model
  #   Reduce if the model has a short context window
  max_context_chars: 4000

model:
  # FILL: LLM provider — "ollama" (local) or "openai" / "anthropic" (API)
  provider: ollama

  # FILL: model name for the chosen provider
  #   ollama examples: llama3.2:3b, llama3.1:8b, mistral:7b
  #   openai examples: gpt-4o-mini, gpt-4o
  #   anthropic examples: claude-haiku-4-5-20251001, claude-sonnet-4-6
  model_name: llama3.2:3b

  # Sampling temperature — 0.0 for deterministic output
  temperature: 0.0

  # Maximum tokens the model may generate per answer
  max_tokens: 512

  # Seconds before an LLM request times out
  timeout_seconds: 60

  # FILL (ollama only): base URL of the running Ollama server
  base_url: http://localhost:11434

judge:
  # Set to true to score answers immediately after generation
  enabled: false

  # FILL: judge LLM provider (can differ from the generator model)
  provider: ollama

  # FILL: judge model name
  model_name: llama3.2:3b

  temperature: 0.0
  max_tokens: 256
  timeout_seconds: 60
  base_url: http://localhost:11434

  prompt:
    id: answer_correctness_v1
    version: v1
    template_path: prompts/judges/answer_correctness_v1.txt
