# Step 6 (optional): Embedding comparison — benchmark multiple embedding models side by side
# Command: python -m financebench_eval compare-embeddings --config config_templates/06_embedding_comparison.yaml
#
# Prerequisite: chunks.jsonl and examples.jsonl from steps 1–2

comparison:
  # FILL (optional): unique label for this comparison run
  #   auto-generated from timestamp if left unset
  # run_id: emb_cmp_20260615

  runs_dir: runs/embedding_comparison
  reports_dir: reports
  index_base_dir: data/indexes/financebench
  cache_dir: data/cache/embeddings

  # Abort the whole comparison on the first model failure (useful for CI)
  fail_fast: false

  retrieval:
    # FILL: path to chunks.jsonl produced by chunk-documents (step 2)
    chunks_path: data/processed/financebench/chunks.jsonl

    # FILL: path to examples.jsonl produced by load-dataset (step 1)
    questions_path: data/processed/financebench/examples.jsonl

    # How many chunks to retrieve per question for scoring
    top_k: 10

    # Minimum text overlap to count a chunk as an evidence hit
    evidence_overlap_threshold: 0.5

    chunking:
      strategy: recursive_text
      chunk_size: 800
      chunk_overlap: 150
      min_chunk_chars: 100

  embedding_models:
    # Add one entry per model you want to compare.
    # Each model gets its own FAISS index and retrieval results.
    # category controls which role the model is assigned in the decision output:
    #   local_baseline, open_source, cheap_api, quality_api, finance_specialized

    # FILL: at least one model entry is required.

    - name: nomic-embed-text
      # FILL: provider — "ollama", "openai", "voyageai", "sentence_transformers", or "mock"
      provider: ollama
      # FILL: embedding dimensionality (check model card)
      dimensions: 768
      normalize: true
      batch_size: 32
      category: local_baseline

    # Uncomment and fill in additional models to compare:
    # - name: text-embedding-3-small
    #   provider: openai
    #   dimensions: 1536
    #   normalize: true
    #   batch_size: 512
    #   category: cheap_api

    # - name: mxbai-embed-large
    #   provider: ollama
    #   dimensions: 1024
    #   normalize: true
    #   batch_size: 32
    #   category: open_source
