# Step 7 (optional): Baseline evaluation — closed-book or oracle-context runs for comparison
# Command: python -m financebench_eval run-baseline --config config_templates/07_baseline_eval.yaml

eval:
  # FILL: path to examples.jsonl produced by step 1
  dataset_path: data/processed/financebench/examples.jsonl

  # Directory where baseline run outputs will be written
  output_dir: runs

  # Evaluation mode:
  #   closed_book     → model answers with no context (tests memorisation)
  #   oracle_context  → model receives the gold evidence text (upper bound)
  mode: closed_book

  # FILL (optional): limit to first N examples for a quick smoke test
  #   remove or set to null to run over the full dataset
  limit: null

model:
  # FILL: LLM provider — "ollama", "openai", or "anthropic"
  provider: ollama

  # FILL: model name
  #   ollama examples: llama3.2:3b, llama3.1:8b
  #   openai examples: gpt-4o-mini
  model_name: llama3.2:3b

  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 60

  # FILL (ollama only): base URL of the running Ollama server
  base_url: http://localhost:11434

judge:
  # Set to false to skip LLM judging and rely on lexical match only
  enabled: true

  # FILL: judge model (can be the same as or different from the generator)
  provider: ollama
  model_name: llama3.2:3b

  temperature: 0.0
  max_tokens: 256
  timeout_seconds: 60
  base_url: http://localhost:11434

  prompt:
    id: answer_correctness_v1
    version: v1
    template_path: prompts/judges/answer_correctness_v1.txt
