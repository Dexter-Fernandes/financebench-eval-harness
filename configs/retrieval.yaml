retrieval:
  pages_path: data/processed/financebench/pages.jsonl
  chunks_path: data/processed/financebench/chunks.jsonl
  index_dir: data/indexes/financebench/octen-embedding-0.6b
  questions_path: data/processed/financebench/examples.jsonl
  runs_dir: runs
  top_k: 5
  evidence_overlap_threshold: 0.5
  good_rank_threshold: 3
  chunking:
    strategy: recursive_text
    chunk_size: 800
    chunk_overlap: 150
    min_chunk_chars: 100
  embedding:
    provider: sentence_transformers
    model_name: Octen/Octen-Embedding-0.6B
    batch_size: 24
    normalize: true
    fusion_dense_weight: 10.0
    fusion_lexical_weight: 1.0
