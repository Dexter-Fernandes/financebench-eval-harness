embedding:
  provider: ollama
  model_name: granite-embedding:278m
  base_url: http://localhost:11434
  timeout_seconds: 30.0
  batch_size: 128
  normalize: true

  # Hybrid retrieval (RRF) fusion weights, calibrated on the 46-question
  # FinanceBench sample (see docs/status.md). granite's dense signal alone is
  # already strong (doc_hit@1=0.587); equal weighting (1:1) let lexical noise
  # outrank confident dense hits (doc_hit@1 dropped to 0.457). 3:1 was the
  # sweet spot of {1:1, 2:1, 3:1, 5:1} — nearly matches dense-alone doc_mrr@10
  # and exceeds it on doc_hit@5.
  fusion_dense_weight: 3.0
  fusion_lexical_weight: 1.0
