rag_eval:
  examples_path: data/processed/financebench/examples.jsonl
  retrieval_results_path: runs/<retrieval_run_id>/retrieval_results.jsonl  # set to your local retrieval run
  retrieval_run_id: null  # set to your local retrieval run ID (e.g. run_001)
  output_dir: runs
  mode: rag_dense
  top_k: 5
  max_context_chars: 4000

model:
  provider: ollama
  model_name: llama3.2:3b
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 60
  base_url: http://localhost:11434

judge:
  enabled: false
  provider: ollama
  model_name: llama3.2:3b
  temperature: 0.0
  max_tokens: 256
  timeout_seconds: 60
  base_url: http://localhost:11434
  prompt:
    id: answer_correctness_v1
    version: v1
    template_path: prompts/judges/answer_correctness_v1.txt
