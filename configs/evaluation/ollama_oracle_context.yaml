eval:
  dataset_path: data/processed/financebench/examples.jsonl
  output_dir: runs
  mode: oracle_context
  limit: 5
model:
  provider: ollama
  model_name: llama3.2:3b
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 60
  base_url: http://localhost:11434
judge:
  enabled: true
  provider: ollama
  model_name: llama3.2:3b
  temperature: 0.0
  max_tokens: 256
  timeout_seconds: 60
  base_url: http://localhost:11434
  prompt:
    id: answer_correctness_v1
    version: v1
    template_path: prompts/judges/answer_correctness_v1.txt
