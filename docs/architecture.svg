<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1352" width="760" height="1352" role="img" aria-labelledby="t d">
<title id="t">financebench-eval-harness architecture and pipeline</title>
<desc id="d">Eight pipeline stages from data ingestion through grounding and hallucination analysis, with an optional embedding comparison branch.</desc>
<defs><style>
  svg { --bg:#ffffff; --card:#f6f8fa; --stroke:#d0d7de; --t1:#1f2328; --t2:#57606a; --acc:#0550ae; --badge:#0969da; --pill:#ddf4ff; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0d1117; --card:#161b22; --stroke:#30363d; --t1:#e6edf3; --t2:#8b949e; --acc:#79c0ff; --badge:#1f6feb; --pill:#0c2d6b; }
  }
  .bg { fill: var(--bg); }
  .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1; }
  .dash { stroke-dasharray: 6 4; }
  .pill { fill: var(--pill); stroke: var(--stroke); }
  .badge { fill: var(--badge); }
  .rule { stroke: var(--stroke); stroke-width: 1; }
  .arrow { stroke: var(--t2); stroke-width: 1.5; }
  .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
  .h { font-size: 15px; }
  .b { font-weight: 600; }
  .t1 { fill: var(--t1); } .t2 { fill: var(--t2); } .acc { fill: var(--acc); } .bw { fill: #ffffff; }
</style>
<marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect class="bg" width="760" height="1352"/>
<rect class="pill" x="20" y="20" width="720" height="34" rx="17"/>
<text class="mono t1 b" x="380.0" y="42" text-anchor="middle">FinanceBench PDFs + questions.jsonl</text>
<line class="arrow" x1="380.0" y1="54" x2="380.0" y2="79" marker-end="url(#head)"/>
<rect class="card" x="20" y="80" width="720" height="120" rx="10"/>
<circle class="badge" cx="44" cy="104" r="12"/>
<text class="sans bw b" x="44" y="108.5" text-anchor="middle">0</text>
<text class="sans t1 b h" x="66" y="109">Data Ingestion</text>
<line class="rule" x1="34" y1="122" x2="726" y2="122"/>
<text class="mono acc b" x="38" y="141">extract-documents</text>
<text class="mono acc b" x="38" y="158">build-examples</text>
<text class="sans t2" x="52" y="175">validate-data · validate-dataset ·</text>
<text class="sans t2" x="52" y="192">validate-documents · validate-evidence-pages</text>
<text class="mono t2" x="410" y="141">→ pages.jsonl</text>
<text class="mono t2" x="410" y="158">→ examples.jsonl</text>
<line class="arrow" x1="380.0" y1="200" x2="380.0" y2="225" marker-end="url(#head)"/>
<rect class="card" x="20" y="226" width="720" height="120" rx="10"/>
<circle class="badge" cx="44" cy="250" r="12"/>
<text class="sans bw b" x="44" y="254.5" text-anchor="middle">1</text>
<text class="sans t1 b h" x="66" y="255">Chunking + Indexing</text>
<line class="rule" x1="34" y1="268" x2="726" y2="268"/>
<text class="mono acc b" x="38" y="287">chunk-documents</text>
<text class="sans t2" x="52" y="304">recursive text split, 800 chars / 150 overlap</text>
<text class="mono acc b" x="38" y="321">build-index</text>
<text class="sans t2" x="52" y="338">FAISS IndexFlatL2</text>
<text class="mono t2" x="410" y="287">→ index.faiss</text>
<text class="mono t2" x="410" y="304">→ index_metadata.json</text>
<text class="mono t2" x="432" y="321">(corpus_hash, model, dim)</text>
<line class="arrow" x1="380.0" y1="346" x2="380.0" y2="371" marker-end="url(#head)"/>
<rect class="card" x="20" y="372" width="720" height="120" rx="10"/>
<circle class="badge" cx="44" cy="396" r="12"/>
<text class="sans bw b" x="44" y="400.5" text-anchor="middle">2</text>
<text class="sans t1 b h" x="66" y="401">Retrieval</text>
<line class="rule" x1="34" y1="414" x2="726" y2="414"/>
<text class="mono acc b" x="38" y="433">retrieve</text>
<text class="sans t2" x="52" y="450">dense top-k (L2 distance)</text>
<text class="mono acc b" x="38" y="467">eval-retrieval</text>
<text class="sans t2" x="52" y="484">doc_hit@k · page_hit@k · evidence_text_hit@k · MRR</text>
<text class="mono t2" x="410" y="433">→ retrieval_results.jsonl</text>
<text class="mono t2" x="410" y="450">→ retrieval_scores.jsonl</text>
<line class="arrow" x1="380.0" y1="492" x2="380.0" y2="517" marker-end="url(#head)"/>
<rect class="card" x="20" y="518" width="720" height="103" rx="10"/>
<circle class="badge" cx="44" cy="542" r="12"/>
<text class="sans bw b" x="44" y="546.5" text-anchor="middle">3</text>
<text class="sans t1 b h" x="66" y="547">RAG Generation</text>
<line class="rule" x1="34" y1="560" x2="726" y2="560"/>
<text class="mono acc b" x="38" y="579">run-rag</text>
<text class="sans t2" x="52" y="596">retrieved chunks → LLM</text>
<text class="sans t2" x="52" y="613">rag_dense | rag_oracle | rag_no_context</text>
<text class="mono t2" x="410" y="579">→ rag_predictions.jsonl</text>
<text class="mono t2" x="410" y="596">→ run_metadata.json</text>
<text class="mono t2" x="410" y="613">→ config.yaml  (snapshot)</text>
<line class="arrow" x1="380.0" y1="621" x2="380.0" y2="646" marker-end="url(#head)"/>
<rect class="card" x="20" y="647" width="720" height="103" rx="10"/>
<circle class="badge" cx="44" cy="671" r="12"/>
<text class="sans bw b" x="44" y="675.5" text-anchor="middle">4</text>
<text class="sans t1 b h" x="66" y="676">Scoring</text>
<line class="rule" x1="34" y1="689" x2="726" y2="689"/>
<text class="mono acc b" x="38" y="708">score-rag</text>
<text class="sans t2" x="52" y="725">lexical + answer judge + grounding judge</text>
<text class="sans t2" x="52" y="742">re-runnable independently of generation</text>
<text class="mono t2" x="410" y="708">→ rag_answer_scores.jsonl</text>
<text class="mono t2" x="410" y="725">→ rag_grounding_scores.jsonl</text>
<text class="mono t2" x="410" y="742">→ rag_combined_scores.jsonl</text>
<line class="arrow" x1="380.0" y1="750" x2="380.0" y2="775" marker-end="url(#head)"/>
<rect class="card" x="20" y="776" width="720" height="103" rx="10"/>
<circle class="badge" cx="44" cy="800" r="12"/>
<text class="sans bw b" x="44" y="804.5" text-anchor="middle">5</text>
<text class="sans t1 b h" x="66" y="805">Metric Joining</text>
<line class="rule" x1="34" y1="818" x2="726" y2="818"/>
<text class="mono acc b" x="38" y="837">join-metrics</text>
<text class="sans t2" x="52" y="854">retrieval hit × answer correct</text>
<text class="sans t2" x="52" y="871">2×2 correlation matrix</text>
<text class="mono t2" x="410" y="837">→ joined_metrics.jsonl</text>
<text class="mono t2" x="410" y="854">→ joined_summary.json</text>
<line class="arrow" x1="380.0" y1="879" x2="380.0" y2="904" marker-end="url(#head)"/>
<rect class="card" x="20" y="905" width="720" height="120" rx="10"/>
<circle class="badge" cx="44" cy="929" r="12"/>
<text class="sans bw b" x="44" y="933.5" text-anchor="middle">6</text>
<text class="sans t1 b h" x="66" y="934">Reporting</text>
<line class="rule" x1="34" y1="947" x2="726" y2="947"/>
<text class="mono acc b" x="38" y="966">report-rag</text>
<text class="sans t2" x="52" y="983">Markdown tables, failure breakdown, example Q/A</text>
<text class="mono acc b" x="38" y="1000">report-baseline</text>
<text class="sans t2" x="52" y="1017">closed-book / oracle reports</text>
<text class="mono t2" x="410" y="966">→ reports/*.md</text>
<line class="arrow" x1="380.0" y1="1025" x2="380.0" y2="1050" marker-end="url(#head)"/>
<rect class="card" x="20" y="1051" width="720" height="154" rx="10"/>
<circle class="badge" cx="44" cy="1075" r="12"/>
<text class="sans bw b" x="44" y="1079.5" text-anchor="middle">7</text>
<text class="sans t1 b h" x="66" y="1080">Grounding + Hallucination Analysis</text>
<line class="rule" x1="34" y1="1093" x2="726" y2="1093"/>
<text class="mono acc b" x="38" y="1112">analyze-grounding</text>
<text class="sans t2" x="52" y="1129">7-label grounding taxonomy</text>
<text class="sans t2" x="52" y="1146">5 rule-based hallucination flags + optional LLM judge</text>
<text class="sans t2" x="52" y="1163">classify_root_cause()</text>
<text class="mono acc b" x="38" y="1180">inspect-failure</text>
<text class="sans t2" x="52" y="1197">single-question drill-down</text>
<text class="mono t2" x="410" y="1112">→ grounding_scores.jsonl</text>
<text class="mono t2" x="410" y="1129">→ citation_scores.jsonl</text>
<text class="mono t2" x="410" y="1146">→ failure_analysis.jsonl</text>
<text class="mono t2" x="410" y="1163">→ hallucination_report.md</text>
<rect class="card dash" x="20" y="1231" width="720" height="101" rx="10"/>
<text class="sans t1 b h" x="38" y="1260">Optional branch · compare-embeddings</text>
<text class="sans t2" x="38" y="1292">Runs Stages 1–2 across 5+ embedding models under identical chunking.</text>
<text class="sans t2" x="38" y="1309">corpus_hash validation ensures a fair comparison.</text>
<text class="sans t2" x="38" y="1326">→ embedding_comparison_*.md leaderboard</text>
</svg>
